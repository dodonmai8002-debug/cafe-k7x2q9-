<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="声日記">
<meta name="theme-color" content="#121318">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>声日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121318; --ink2:#1a1c23; --ink3:#23262f;
  --paper:#efe7d8; --paper2:#cfc6b5; --muted:#8a8576;
  --accent:#e2a95f; --accent2:#f3c88a;
  --line:rgba(239,231,216,.13);
  --mincho:"Shippori Mincho",serif;
  --gothic:"Zen Kaku Gothic New",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:var(--gothic)}
body{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding:calc(var(--st) + 14px) 20px calc(var(--sb) + 18px);
  background:radial-gradient(120% 70% at 85% 0%,#1d2029 0%,var(--ink) 60%)}
.screen.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- home ---------- */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;padding:4px 4px 0}
.brand{font-family:var(--mincho);font-weight:700;font-size:26px;letter-spacing:.12em}
.brand small{display:block;font-family:var(--gothic);font-weight:400;font-size:12px;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.head-r{display:flex;align-items:flex-end;gap:10px}
.count{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
.count b{font-family:var(--mincho);font-size:22px;color:var(--paper);font-weight:600}
.gear{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted);margin-bottom:-4px}
.gear:active{background:var(--ink3)}
.note{font-size:11.5px;color:var(--muted);padding:6px 4px 0;min-height:18px}
.wheel{position:relative;flex:1;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;margin:0 -20px}
.wheel svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wm{position:absolute;right:22px;bottom:12px;text-align:right;pointer-events:none;font-family:var(--mincho);color:rgba(239,231,216,.07);line-height:.95}
.wm .y{font-size:22px;letter-spacing:.1em}
.wm .m{font-size:84px;font-weight:700}
.card{position:absolute;left:0;top:0;transform-origin:0 0;padding:10px 0 10px 22px;will-change:transform,opacity;cursor:pointer}
.card::before{content:"";position:absolute;left:-5px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--ink);border:1.5px solid var(--paper2)}
.card.focus::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 6px rgba(226,169,95,.15)}
.card .dt{display:flex;align-items:baseline;gap:8px;color:var(--paper2)}
.card .md{font-family:var(--mincho);font-weight:600;font-size:17px;letter-spacing:.06em}
.card .wd{font-size:12px;color:var(--muted)}
.card .tt{font-family:var(--mincho);font-weight:600;font-size:25px;line-height:1.4;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.focus .md{color:var(--accent2)}
.card.today .wd::after{content:"・今日";color:var(--accent)}
.empty{position:absolute;left:34px;right:28px;top:50%;transform:translateY(-50%);font-family:var(--mincho);font-size:19px;line-height:1.9;color:var(--paper2)}
.empty small{display:block;font-family:var(--gothic);font-size:13px;color:var(--muted);margin-top:10px;line-height:1.8}
.swipe-hint{position:absolute;left:34px;bottom:14px;font-size:11px;color:var(--muted);letter-spacing:.06em;pointer-events:none}
.dock{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:8px}
.mic{width:74px;height:74px;border-radius:50%;background:var(--accent);color:#1b1408;display:grid;place-items:center;
  box-shadow:0 10px 30px rgba(226,169,95,.28),0 0 0 8px rgba(226,169,95,.08);transition:transform .15s}
.mic:active{transform:scale(.94)}
.dock span{font-size:12.5px;color:var(--paper2);letter-spacing:.08em}

/* ---------- compose ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--paper2)}
.icon-btn:active{background:var(--ink3)}
.bar .day{font-family:var(--mincho);font-weight:600;font-size:16px;letter-spacing:.06em}
.steps{display:flex;gap:6px;justify-content:center;margin:6px 0 18px}
.steps i{width:22px;height:3px;border-radius:2px;background:var(--ink3)}
.steps i.on{background:var(--accent)}
.lead{font-family:var(--mincho);font-weight:600;font-size:22px;line-height:1.6;margin-bottom:6px}
.sub{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:14px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--paper);background:var(--ink2);border:1px solid var(--line);border-radius:16px;outline:none;-webkit-appearance:none}
textarea{min-height:34vh;padding:16px 16px;font-size:17px;line-height:1.95;resize:none}
textarea:focus,input[type=text]:focus{border-color:rgba(226,169,95,.5)}
textarea::placeholder,input::placeholder{color:#5f5b52}
.interim{color:var(--muted);font-size:15px;line-height:1.8;min-height:27px;margin:8px 4px 0}
.primary{width:100%;margin-top:14px;padding:16px;border-radius:16px;background:var(--accent);color:#1b1408;font-weight:700;font-size:16px;letter-spacing:.06em}
.primary:disabled{opacity:.35}
.ghost{display:block;margin:12px auto 0;padding:8px 14px;font-size:13px;color:var(--paper2);text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(239,231,216,.3)}
.status{font-size:12.5px;color:var(--muted);min-height:20px;margin:8px 2px 0}
.title-input{font-family:var(--mincho)!important;font-size:24px!important;font-weight:600;padding:16px 18px!important}
.preview{margin-top:18px;padding:14px 16px;border-left:2px solid var(--line);font-size:13.5px;line-height:1.9;color:var(--muted);white-space:pre-wrap;max-height:30vh;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 65%,transparent)}
.cnt{text-align:right;font-size:11.5px;color:var(--muted);margin-top:6px}

/* 録音ボタン */
.rec-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 18px}
.rec{position:relative;width:96px;height:96px;border-radius:50%;background:var(--accent);color:#1b1408;display:grid;place-items:center;
  box-shadow:0 12px 34px rgba(226,169,95,.3);transition:transform .15s,background .2s}
.rec:active{transform:scale(.95)}
.rec .ring{position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(226,169,95,.5);opacity:0}
.rec.on{background:#e2735f;box-shadow:0 12px 34px rgba(226,115,95,.35)}
.rec.on .ring{animation:ring 1.6s ease-out infinite}
.rec.on .ring.b{animation-delay:.8s}
@keyframes ring{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
.rec .ic-stop{display:none}
.rec.on .ic-mic{display:none}
.rec.on .ic-stop{display:block}
.rec-label{font-size:13px;color:var(--paper2);letter-spacing:.06em}
.rec-time{font-family:var(--mincho);font-size:15px;color:var(--accent2);min-height:22px;letter-spacing:.08em}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(6,7,10,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(var(--st) + 28px);z-index:41;background:#f1eadd;color:#2a2620;border-radius:22px 22px 0 0;
  transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#cfc5b2;margin:10px auto 0}
.sheet .sbar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px 0}
.sheet .icon-btn{color:#6b6355}
.sheet .icon-btn:active{background:#e3d9c7}
.sheet .body{flex:1;overflow-y:auto;padding:6px 26px calc(var(--sb) + 30px)}
.sheet .sd{font-family:var(--mincho);font-size:14px;letter-spacing:.1em;color:#8b8170}
.sheet h1{font-family:var(--mincho);font-weight:700;font-size:28px;line-height:1.5;margin:6px 0 18px;padding-bottom:16px;border-bottom:1px solid #ddd2bf}
.sheet h2{font-family:var(--mincho);font-weight:700;font-size:22px;margin:6px 0 10px}
.sheet .txt{font-family:var(--mincho);font-size:17px;line-height:2.05;white-space:pre-wrap;word-break:break-word}
.sheet .raw{margin-top:22px;padding:14px 16px;background:#e7dfcf;border-radius:12px;font-size:13.5px;line-height:1.9;color:#6b6355;white-space:pre-wrap;display:none}
.sheet .raw.on{display:block}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
.sheet .acts button{padding:9px 14px;border-radius:20px;border:1px solid #d6cbb7;font-size:13px;color:#5b5446}
.sheet .acts button.danger{color:#a34a3a;border-color:#e2c4bb}
.sheet textarea,.sheet input[type=text]{background:#fbf7f0;color:#2a2620;border-color:#d6cbb7}
.sheet textarea{font-family:var(--mincho);min-height:46vh}
.sheet .primary{background:#2a2620;color:#f1eadd}
.sheet .p{font-size:14px;line-height:1.9;color:#5b5446;margin-bottom:12px}
.sheet .row{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:14px;background:#e7dfcf;margin-bottom:10px;font-size:15px;color:#2a2620}
.sheet .row small{display:block;font-size:12px;color:#8b8170;margin-top:2px}

/* ---------- modal & toast ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(6,7,10,.55);padding:24px}
.modal.on{display:flex}
.modal .box{width:100%;max-width:340px;background:var(--ink2);border:1px solid var(--line);border-radius:20px;padding:22px 20px 14px}
.modal p{font-size:15px;line-height:1.8;margin-bottom:16px;white-space:pre-wrap}
.modal .btns{display:flex;flex-direction:column;gap:8px}
.modal .btns button{padding:13px;border-radius:13px;background:var(--ink3);font-size:15px}
.modal .btns button.main{background:var(--accent);color:#1b1408;font-weight:700}
.modal .btns button.danger{color:#ef8f7b}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 120px);transform:translate(-50%,20px);opacity:0;z-index:70;background:#2b2e38;color:var(--paper);
  padding:10px 16px;border-radius:12px;font-size:13px;transition:.25s;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<section class="screen on" id="home">
  <div class="home-head">
    <div class="brand">声日記<small id="todayLabel"></small></div>
    <div class="head-r">
      <div class="count" id="count"></div>
      <button class="gear" id="gearBtn" aria-label="設定">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="note" id="note"></div>
  <div class="wheel" id="wheel">
    <svg id="arc"><path id="arcPath" fill="none" stroke="rgba(239,231,216,.13)" stroke-width="1"/></svg>
    <div class="wm" id="wm"><div class="y"></div><div class="m"></div></div>
    <div class="empty" id="empty" hidden></div>
    <div class="swipe-hint" id="swipeHint" hidden>上へスワイプで過去へ</div>
  </div>
  <div class="dock">
    <button class="mic" id="micBtn" aria-label="今日の日記を話す">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
    </button>
    <span id="micLabel">今日を話す</span>
  </div>
</section>

<!-- ===== STEP 1: TALK ===== -->
<section class="screen scroll" id="talk">
  <div class="bar">
    <button class="icon-btn" id="talkClose" aria-label="閉じる"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="day" id="talkDay"></div>
    <div style="width:40px"></div>
  </div>
  <div class="steps"><i class="on"></i><i></i></div>

  <div id="talkRawWrap">
    <div class="lead" id="talkLead">今日は、どんな一日でしたか。</div>
    <p class="sub" id="talkSub">ボタンを押して話してください。「えー」「あー」は気にせず、思いつくままでOK。終わったらもう一度押します。</p>
    <div class="rec-wrap" id="recWrap">
      <button class="rec" id="recBtn" aria-label="録音">
        <span class="ring"></span><span class="ring b"></span>
        <svg class="ic-mic" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
        <svg class="ic-stop" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
      </button>
      <div class="rec-time" id="recTime"></div>
      <div class="rec-label" id="recLabel">押して話す</div>
    </div>
    <textarea id="raw" placeholder="話した言葉が、ここに文字になって入ります"></textarea>
    <div class="interim" id="interim"></div>
    <button class="primary" id="cleanBtn" disabled>言葉を整える</button>
  </div>

  <div id="talkCleanWrap" hidden>
    <div class="lead">整えた日記</div>
    <p class="sub">言いよどみを取り除きました。気になるところは直接直せます。</p>
    <textarea id="clean"></textarea>
    <button class="primary" id="toTitleBtn">これでOK、タイトルへ</button>
    <button class="ghost" id="backRawBtn">話した言葉に戻る</button>
  </div>
</section>

<!-- ===== STEP 2: TITLE ===== -->
<section class="screen scroll" id="titleScr">
  <div class="bar">
    <button class="icon-btn" id="titleBack" aria-label="戻る"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="day" id="titleDay"></div>
    <div style="width:40px"></div>
  </div>
  <div class="steps"><i class="on"></i><i class="on"></i></div>
  <div class="lead">今日に、タイトルを。</div>
  <p class="sub">あとで一覧に並ぶのは、日付とこのタイトルだけです。マイクを押せば声でも入れられます。</p>
  <div style="position:relative">
    <input type="text" id="title" class="title-input" maxlength="30" placeholder="例：雨上がりの帰り道" autocomplete="off" style="padding-right:62px!important">
    <button id="titleMic" aria-label="タイトルを声で入れる" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--accent)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
    </button>
  </div>
  <div class="cnt" id="titleCnt">0 / 30</div>
  <button class="primary" id="saveBtn" disabled>記録する</button>
  <div class="preview" id="titlePreview"></div>
</section>

<!-- ===== SHEET ===== -->
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sbar">
    <button class="icon-btn" id="sheetClose" aria-label="閉じる"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <div class="body" id="sheetBody"></div>
</div>

<div class="modal" id="modal"><div class="box"><p id="modalMsg"></p><div class="btns" id="modalBtns"></div></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const WD = ["日","月","火","水","木","金","土"];
const pad = n => String(n).padStart(2,"0");
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ---------- 日付（朝4時で日付が切り替わる） ---------- */
function dayKey(d = new Date()){
  const t = new Date(d.getTime() - 4*3600e3);
  return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
}
function parseKey(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
function longLabel(k){ const d = parseKey(k); return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; }

/* ---------- toast / modal ---------- */
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), 2600); }
function ask(msg, buttons){
  return new Promise(res => {
    $("modalMsg").textContent = msg;
    const box = $("modalBtns"); box.innerHTML = "";
    buttons.forEach(b => {
      const el = document.createElement("button");
      el.textContent = b.label; if (b.cls) el.className = b.cls;
      el.onclick = () => { $("modal").classList.remove("on"); res(b.value); };
      box.appendChild(el);
    });
    $("modal").classList.add("on");
  });
}

/* ---------- 保存（このiPhoneの中） ---------- */
const KEY = "koe-nikki-v1";
let entries = [];
function load(){ try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; } }
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(entries)); return true; }
  catch { toast("保存できませんでした（容量がいっぱいかもしれません）"); return false; }
}
function setEntries(list){
  entries = list.filter(e => e && e.date).sort((a,b) => a.date < b.date ? 1 : -1);
  buildCards(); renderHome();
}
function saveEntry(e){
  const l = entries.filter(x => x.date !== e.date); l.push(e);
  setEntries(l); return persist();
}
function deleteEntry(key){ setEntries(entries.filter(x => x.date !== key)); persist(); }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ---------- 音声認識 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const recog = { on: false, rec: null, target: null, base: "", seg: "", onFinish: null, started: 0, timer: null };

function joinResults(results){
  // iOSは同じ内容を繰り返し返すことがあるため、前の結果を含む結果は置き換える
  let out = "";
  for (let i = 0; i < results.length; i++){
    const t = results[i][0].transcript;
    if (out && t.startsWith(out.trim())) out = t;
    else out += t;
  }
  return out;
}
function withPeriod(s){
  s = s.trim(); if (!s) return "";
  return /[。！？!?、]$/.test(s) ? s : s + "。";
}
function startRec(target, opts = {}){
  if (!SR){ noSR(); return false; }
  recog.on = true; recog.target = target; recog.seg = "";
  recog.single = !!opts.single; recog.onFinish = opts.onFinish || null;
  recog.base = target.value;
  recog.started = Date.now();
  spin();
  return true;
}
function spin(){
  const r = new SR();
  r.lang = "ja-JP"; r.continuous = !recog.single; r.interimResults = true; r.maxAlternatives = 1;
  r.onresult = e => {
    recog.seg = joinResults(e.results);
    const last = e.results[e.results.length - 1];
    const interim = last && !last.isFinal ? last[0].transcript : "";
    renderLive(interim);
  };
  r.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed"){
      recog.on = false; stopUI();
      toast("マイクの使用が許可されていません。設定 → Safari → マイク を確認してください");
    } else if (e.error === "audio-capture"){
      recog.on = false; stopUI(); toast("マイクが使えませんでした");
    }
    // no-speech / aborted / network は onend で再開 or 終了
  };
  r.onend = () => {
    commitSeg();
    if (recog.on && !recog.single){ try { spin(); return; } catch {} }
    recog.on = false; stopUI();
    if (recog.onFinish) recog.onFinish();
  };
  recog.rec = r;
  try { r.start(); } catch { recog.on = false; stopUI(); toast("録音を始められませんでした"); }
}
function commitSeg(){
  const t = recog.target; if (!t) return;
  if (recog.single){ t.value = (recog.seg || t.value).trim(); }
  else {
    const add = withPeriod(recog.seg);
    if (add){ recog.base = recog.base ? recog.base.replace(/\s+$/,"") + add : add; }
    t.value = recog.base;
  }
  recog.seg = "";
  t.dispatchEvent(new Event("input"));
  $("interim").textContent = "";
}
function renderLive(interim){
  const t = recog.target; if (!t) return;
  if (recog.single){ t.value = recog.seg; t.dispatchEvent(new Event("input")); return; }
  const fin = recog.seg.slice(0, recog.seg.length - interim.length);
  t.value = (recog.base || "") + fin;
  $("interim").textContent = interim;
  t.scrollTop = t.scrollHeight;
  t.dispatchEvent(new Event("input"));
}
function stopRec(){
  recog.on = false;
  if (recog.rec){ try { recog.rec.stop(); } catch {} }
}
function noSR(){
  ask("この画面では音声認識が使えません。\nSafariで開くか、キーボードのマイクで話してください。", [{ label: "OK", value: true, cls: "main" }]);
}

/* 録音ボタンのUI */
function startUI(){
  $("recBtn").classList.add("on"); $("recLabel").textContent = "聞いています… 押すと終了";
  const tick = () => { const s = Math.floor((Date.now() - recog.started) / 1000); $("recTime").textContent = `${Math.floor(s/60)}:${pad(s%60)}`; };
  tick(); clearInterval(recog.timer); recog.timer = setInterval(tick, 500);
  $("raw").readOnly = true;
}
function stopUI(){
  $("recBtn").classList.remove("on"); $("recLabel").textContent = $("raw").value.trim() ? "押して続きを話す" : "押して話す";
  clearInterval(recog.timer); $("recTime").textContent = "";
  $("raw").readOnly = false; $("interim").textContent = "";
  $("titleMic").style.color = "";
}
$("recBtn").onclick = () => {
  if (recog.on){ stopRec(); return; }
  if (startRec($("raw"))) startUI();
};
$("titleMic").onclick = () => {
  if (recog.on){ stopRec(); return; }
  if (startRec($("title"), { single: true })) $("titleMic").style.color = "#e2735f";
};

/* ---------- 言葉を整える ---------- */
function localClean(text){
  let s = text.replace(/\r/g, "");
  const B = "(^|[、。，,．！？!?「」\\s])";
  const sure = new RegExp(B + "(?:えーっと|ええっと|えっと|えーと|ええと|あのー+|あのう|あの〜+|うーん+|うーむ|んーと|んー+|そのー+|その〜+)[ー〜]*[、，,\\s]*", "gm");
  const maybe = new RegExp(B + "(?:えー+|ええー+|あー+|あぁ+|まぁ|まあー*|なんかー*)(?=[、，,\\s。]|$)[、，,\\s]*", "gm");
  for (let i = 0; i < 3; i++) s = s.replace(sure, "$1").replace(maybe, "$1");
  // 文中の空白は読点に
  s = s.replace(/([^\s、。！？!?])[ 　]+(?=[^\s、。！？!?])/g, "$1、");
  // 「。」ごとに改行して読みやすく
  s = s.replace(/。(?!\n)/g, "。\n");
  return s.replace(/[、，,]{2,}/g, "、").replace(/。[、，,]+/g, "。").replace(/[、，,]+。/g, "。")
          .replace(/^[、，,\s]+/gm, "").replace(/[ \t　]{2,}/g, " ").replace(/\n{2,}/g, "\n").trim();
}

/* ---------- 記録フロー ---------- */
const draft = { mode: "new", existing: null, raw: "", cleaned: "" };
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }

async function startTalk(){
  const key = dayKey();
  const ex = entries.find(e => e.date === key);
  draft.mode = "new"; draft.existing = null;
  if (ex){
    const c = await ask(`${longLabel(key)}の日記は、もう記録してあります。`, [
      { label: "続きを話す", value: "append", cls: "main" },
      { label: "最初から書き直す", value: "rewrite" },
      { label: "やめる", value: null }
    ]);
    if (!c) return;
    draft.mode = c; draft.existing = ex;
  }
  draft.raw = ""; draft.cleaned = "";
  $("raw").value = ""; $("clean").value = ""; $("interim").textContent = "";
  $("cleanBtn").disabled = true;
  $("talkLead").textContent = draft.mode === "append" ? "続きを、どうぞ。" : "今日は、どんな一日でしたか。";
  if (!SR){
    $("recWrap").hidden = true;
    $("talkSub").textContent = "この画面ではボタン録音が使えないため、入力欄をタップしてキーボードのマイクで話してください。";
  }
  $("talkDay").textContent = longLabel(key);
  $("talkRawWrap").hidden = false; $("talkCleanWrap").hidden = true;
  stopUI();
  show("talk");
  if (SR && startRec($("raw"))) startUI();   // 開いたらすぐ録音開始
}

$("raw").addEventListener("input", () => { $("cleanBtn").disabled = !$("raw").value.trim(); });

$("cleanBtn").onclick = () => {
  if (recog.on){ stopRec(); setTimeout(() => $("cleanBtn").click(), 400); return; }
  const raw = $("raw").value.trim(); if (!raw) return;
  draft.raw = raw;
  $("clean").value = localClean(raw);
  $("talkRawWrap").hidden = true; $("talkCleanWrap").hidden = false;
  $("talk").scrollTop = 0;
};
$("backRawBtn").onclick = () => {
  $("raw").value = draft.raw; $("cleanBtn").disabled = !draft.raw;
  $("talkRawWrap").hidden = false; $("talkCleanWrap").hidden = true; stopUI();
};
$("talkClose").onclick = async () => {
  if (recog.on) stopRec();
  if ($("raw").value.trim() || draft.raw){
    const ok = await ask("書きかけの日記を破棄しますか？", [{ label: "破棄する", value: true, cls: "danger" }, { label: "続ける", value: false }]);
    if (!ok) return;
  }
  show("home"); requestLayout();
};
$("toTitleBtn").onclick = () => {
  const c = $("clean").value.trim(); if (!c) { toast("日記の内容が空です"); return; }
  draft.cleaned = c;
  $("titleDay").textContent = longLabel(dayKey());
  $("title").value = draft.mode === "append" && draft.existing ? (draft.existing.title || "") : "";
  updateTitle();
  $("titlePreview").textContent = draft.mode === "append" && draft.existing ? draft.existing.content + "\n" + c : c;
  show("titleScr");
};
$("titleBack").onclick = () => { if (recog.on) stopRec(); show("talk"); };
function updateTitle(){ const v = $("title").value; $("titleCnt").textContent = `${v.length} / 30`; $("saveBtn").disabled = !v.trim(); }
$("title").addEventListener("input", () => { if ($("title").value.length > 30) $("title").value = $("title").value.slice(0,30); updateTitle(); });
$("title").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); $("saveBtn").click(); } });

$("saveBtn").onclick = () => {
  if (recog.on) stopRec();
  const title = $("title").value.trim().replace(/[。、]$/, ""); if (!title) return;
  const key = dayKey(); const now = Date.now();
  const ex = draft.mode === "append" ? draft.existing : null;
  saveEntry({
    date: key, title,
    content: ex ? ex.content + "\n" + draft.cleaned : draft.cleaned,
    raw: ex ? (ex.raw || "") + "\n\n" + draft.raw : draft.raw,
    createdAt: ex ? (ex.createdAt || now) : now, updatedAt: now
  });
  show("home"); vel = 0; target0 = true; requestLayout();
  toast("記録しました");
};

/* ---------- シート（詳細・設定） ---------- */
let openKey = null;
function openSheet(){ $("sheetBody").scrollTop = 0; $("veil").classList.add("on"); $("sheet").classList.add("on"); }
function closeSheet(){ openKey = null; $("veil").classList.remove("on"); $("sheet").classList.remove("on"); }
$("veil").onclick = closeSheet; $("sheetClose").onclick = closeSheet;

function openDetail(key, edit){
  const e = entries.find(x => x.date === key); if (!e) return;
  openKey = key;
  const b = $("sheetBody"); b.innerHTML = "";
  const d = parseKey(key);
  const sd = document.createElement("div"); sd.className = "sd";
  sd.textContent = `${d.getFullYear()}年 ${longLabel(key)}`;
  b.appendChild(sd);
  if (!edit){
    const h = document.createElement("h1"); h.textContent = e.title || "（無題）"; b.appendChild(h);
    const t = document.createElement("div"); t.className = "txt"; t.textContent = e.content || ""; b.appendChild(t);
    const raw = document.createElement("div"); raw.className = "raw"; raw.textContent = e.raw || "（記録なし）";
    const acts = document.createElement("div"); acts.className = "acts";
    const mk = (label, fn, cls) => { const x = document.createElement("button"); x.textContent = label; if (cls) x.className = cls; x.onclick = fn; acts.appendChild(x); return x; };
    const rb = mk("話したままの言葉", () => { raw.classList.toggle("on"); rb.textContent = raw.classList.contains("on") ? "閉じる" : "話したままの言葉"; });
    mk("編集", () => openDetail(key, true));
    mk("削除", async () => {
      const ok = await ask(`${longLabel(key)}の日記を削除しますか？\n元に戻せません。`, [{ label: "削除する", value: true, cls: "danger" }, { label: "やめる", value: false }]);
      if (!ok) return; closeSheet(); deleteEntry(key); toast("削除しました");
    }, "danger");
    b.appendChild(acts); b.appendChild(raw);
  } else {
    const ti = document.createElement("input"); ti.type = "text"; ti.maxLength = 30; ti.value = e.title || "";
    ti.className = "title-input"; ti.style.margin = "10px 0 12px";
    const ta = document.createElement("textarea"); ta.value = e.content || "";
    const sv = document.createElement("button"); sv.className = "primary"; sv.textContent = "保存する";
    sv.onclick = () => {
      if (!ti.value.trim()) { toast("タイトルを入れてください"); return; }
      saveEntry(Object.assign({}, e, { title: ti.value.trim(), content: ta.value.trim(), updatedAt: Date.now() }));
      openDetail(key); toast("保存しました");
    };
    const cancel = document.createElement("button"); cancel.className = "ghost"; cancel.style.color = "#6b6355"; cancel.textContent = "やめる";
    cancel.onclick = () => openDetail(key);
    b.append(ti, ta, sv, cancel);
  }
  openSheet();
}

function openSettings(){
  const b = $("sheetBody"); b.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = "バックアップ"; b.appendChild(h);
  const p = document.createElement("p"); p.className = "p";
  p.textContent = "日記はこのiPhoneの中だけに保存されています。機種変更やデータ消去に備えて、ときどきバックアップを「ファイル」アプリなどに保存しておくと安心です。";
  b.appendChild(p);
  const row = (label, sub, fn) => { const x = document.createElement("button"); x.className = "row"; x.textContent = label; const s = document.createElement("small"); s.textContent = sub; x.appendChild(s); x.onclick = fn; b.appendChild(x); };
  row("バックアップを保存", `${entries.length}日分の日記を1つのファイルにまとめます`, exportData);
  row("バックアップから戻す", "保存したファイルを選ぶと、日記を読み込みます", () => $("importFile").click());
  const last = (() => { try { return localStorage.getItem(KEY + "-lastbackup"); } catch { return null; } })();
  if (last){ const q = document.createElement("p"); q.className = "p"; q.style.marginTop = "6px"; const d = new Date(+last); q.textContent = `前回のバックアップ：${d.getMonth()+1}月${d.getDate()}日`; b.appendChild(q); }
  openSheet();
}
$("gearBtn").onclick = openSettings;

async function exportData(){
  const data = JSON.stringify({ app: "koe-nikki", version: 1, exportedAt: new Date().toISOString(), entries }, null, 1);
  const name = `声日記_${dayKey()}.json`;
  const file = new File([data], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: "声日記のバックアップ" });
    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
    try { localStorage.setItem(KEY + "-lastbackup", String(Date.now())); } catch {}
    toast("バックアップを作りました");
  } catch (e) {
    if (e && e.name === "AbortError") return;
    toast("バックアップを作れませんでした");
  }
}
$("importFile").addEventListener("change", async () => {
  const f = $("importFile").files[0]; $("importFile").value = ""; if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    const list = Array.isArray(obj) ? obj : obj.entries;
    if (!Array.isArray(list)) throw 0;
    const valid = list.filter(e => e && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && typeof e.title === "string");
    const ok = await ask(`${valid.length}日分の日記を読み込みます。\n同じ日付の日記はファイルの内容で上書きされます。`, [{ label: "読み込む", value: true, cls: "main" }, { label: "やめる", value: false }]);
    if (!ok) return;
    const map = new Map(entries.map(e => [e.date, e]));
    valid.forEach(e => map.set(e.date, e));
    setEntries([...map.values()]); persist(); closeSheet(); toast(`${valid.length}日分を読み込みました`);
  } catch { toast("このファイルは読み込めませんでした"); }
});

// シートを下に引いて閉じる
(() => {
  let y0 = null, dy = 0; const sh = $("sheet");
  sh.addEventListener("touchstart", e => { if ($("sheetBody").scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } }, { passive: true });
  sh.addEventListener("touchmove", e => { if (y0 === null) return; dy = e.touches[0].clientY - y0; if (dy > 0 && $("sheetBody").scrollTop <= 0 && !e.target.closest("textarea,input")) { sh.style.transition = "none"; sh.style.transform = `translateY(${dy}px)`; } }, { passive: true });
  sh.addEventListener("touchend", () => { if (y0 === null) return; sh.style.transition = ""; sh.style.transform = ""; if (dy > 110) closeSheet(); y0 = null; });
})();

/* ---------- 半円の一覧 ---------- */
const wheel = $("wheel");
let cards = [];
let pos = 0, vel = 0, dragging = false, raf = null, lastTs = 0, target0 = false;
let G = { W: 0, H: 0, R: 300, cy: 300, left: 34, step: 0.32 };

function geom(){
  const r = wheel.getBoundingClientRect();
  G.W = r.width; G.H = r.height; G.cy = r.height / 2;
  G.R = Math.max(220, r.height * 0.47);
  G.step = Math.min(0.42, 96 / G.R);
  const cx = G.left + G.R;
  $("arcPath").setAttribute("d", `M ${cx} ${G.cy - G.R} A ${G.R} ${G.R} 0 0 0 ${cx} ${G.cy + G.R}`);
}
function buildCards(){
  cards.forEach(c => c.remove()); cards = [];
  const today = dayKey();
  entries.forEach((e, i) => {
    const d = parseKey(e.date);
    const el = document.createElement("div"); el.className = "card" + (e.date === today ? " today" : "");
    el.dataset.i = i;
    const dt = document.createElement("div"); dt.className = "dt";
    const md = document.createElement("span"); md.className = "md"; md.textContent = `${d.getMonth()+1}.${pad(d.getDate())}`;
    const wd = document.createElement("span"); wd.className = "wd"; wd.textContent = WD[d.getDay()] + "曜";
    dt.append(md, wd);
    const tt = document.createElement("div"); tt.className = "tt"; tt.textContent = e.title || "（無題）";
    el.append(dt, tt);
    wheel.appendChild(el); cards.push(el);
  });
  pos = clamp(pos, 0, Math.max(0, entries.length - 1));
  requestLayout();
}
function layout(){
  const n = cards.length;
  const fi = clamp(Math.round(pos), 0, Math.max(0, n - 1));
  for (let i = 0; i < n; i++){
    const el = cards[i]; const d = i - pos; const th = d * G.step;
    if (Math.abs(th) > 1.5){ el.style.display = "none"; continue; }
    el.style.display = "";
    const c = Math.cos(th);
    const x = G.left + G.R * (1 - c);
    const y = G.cy + G.R * Math.sin(th);
    const s = 0.42 + 0.58 * Math.pow(c, 1.6);
    el.style.width = Math.max(80, (G.W - x - 18) / s) + "px";
    el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${s}) translateY(-50%)`;
    el.style.opacity = Math.max(0, Math.pow(c, 2.2)).toFixed(3);
    el.style.zIndex = String(100 - Math.round(Math.abs(d) * 10));
    el.classList.toggle("focus", i === fi);
  }
  if (n){
    const d = parseKey(entries[fi].date);
    $("wm").firstElementChild.textContent = d.getFullYear();
    $("wm").lastElementChild.textContent = (d.getMonth() + 1) + "月";
  }
}
function tick(ts){
  raf = null;
  const dt = lastTs ? Math.min(34, ts - lastTs) : 16; lastTs = ts;
  const max = Math.max(0, cards.length - 1);
  let moving = dragging;
  if (!dragging){
    if (Math.abs(vel) > 0.0005){
      pos += vel * dt; vel *= Math.pow(0.94, dt / 16);
      if (pos < -0.4 || pos > max + 0.4){ vel = 0; }
      moving = true;
    } else {
      vel = 0;
      const t = target0 ? 0 : clamp(Math.round(pos), 0, max);
      const diff = t - pos;
      if (Math.abs(diff) > 0.002){ pos += diff * Math.min(1, 0.2 * dt / 16); moving = true; }
      else { pos = t; target0 = false; }
    }
  }
  layout();
  if (moving) raf = requestAnimationFrame(tick); else lastTs = 0;
}
function requestLayout(){ if (!raf) raf = requestAnimationFrame(tick); }

let pid = null, y0 = 0, p0 = 0, t0 = 0, moved = 0, downCard = null, hist = [];
wheel.addEventListener("pointerdown", e => {
  if (!cards.length) return;
  pid = e.pointerId; dragging = true; vel = 0; target0 = false;
  y0 = e.clientY; p0 = pos; t0 = performance.now(); moved = 0; hist = [{ t: t0, p: pos }];
  downCard = e.target.closest(".card");
  try { wheel.setPointerCapture(pid); } catch {}
});
wheel.addEventListener("pointermove", e => {
  if (!dragging || e.pointerId !== pid) return;
  const dy = e.clientY - y0; moved = Math.max(moved, Math.abs(dy));
  let p = p0 - dy / (G.R * G.step);
  const max = Math.max(0, cards.length - 1);
  if (p < 0) p = p * 0.35; else if (p > max) p = max + (p - max) * 0.35;
  pos = p;
  const now = performance.now(); hist.push({ t: now, p: pos }); while (hist.length > 5) hist.shift();
  requestLayout();
});
function endDrag(e){
  if (!dragging || (e && e.pointerId !== pid)) return;
  dragging = false; pid = null;
  const now = performance.now();
  if (moved < 8 && now - t0 < 400 && downCard){
    const en = entries[+downCard.dataset.i];
    if (en) openDetail(en.date);
    requestLayout(); return;
  }
  const a = hist[0], b = hist[hist.length - 1];
  vel = (b && a && b.t - a.t > 0 && now - b.t < 80) ? clamp((b.p - a.p) / (b.t - a.t), -0.03, 0.03) : 0;
  requestLayout();
}
wheel.addEventListener("pointerup", endDrag);
wheel.addEventListener("pointercancel", endDrag);
wheel.addEventListener("wheel", e => {
  if (!cards.length) return; e.preventDefault();
  const max = Math.max(0, cards.length - 1);
  pos = clamp(pos + e.deltaY / (G.R * G.step), -0.3, max + 0.3); vel = 0; target0 = false;
  requestLayout();
}, { passive: false });

function renderHome(){
  const n = entries.length;
  $("count").innerHTML = "";
  if (n){ const b = document.createElement("b"); b.textContent = n; $("count").append(b, document.createTextNode(" 日分")); }
  const empty = $("empty");
  if (!n){
    empty.hidden = false; empty.innerHTML = "";
    empty.appendChild(document.createTextNode("まだ日記はありません。"));
    const s = document.createElement("small"); s.textContent = "下のマイクを押して、今日のことを話してみましょう。"; empty.appendChild(s);
  } else empty.hidden = true;
  $("swipeHint").hidden = n < 2;
  $("wm").style.display = n ? "" : "none";
  $("micLabel").textContent = entries.some(e => e.date === dayKey()) ? "今日の続きを話す" : "今日を話す";
}

$("micBtn").onclick = startTalk;
window.addEventListener("resize", () => { geom(); requestLayout(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && recog.on) stopRec(); });

/* ---------- 起動 ---------- */
$("todayLabel").textContent = longLabel(dayKey());
geom(); setEntries(load());
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
