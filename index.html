<title>セルフカフェ</title>
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#2a211b;--sub:#8a7b6e;--line:#e7ddd1;--accent:#7a4a2a;--ok:#4f7a5a;--warn:#a0522d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:440px;margin:0 auto;padding:14px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.top h1{font-size:15px;letter-spacing:.12em;margin:0;color:var(--accent)}
.top .d{font-size:13px;color:var(--sub)}
.qrcard{background:#fff;border-radius:22px;padding:22px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(60,40,20,.06);text-align:center}
.qrcard svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.qrhint{font-size:12px;color:var(--sub);margin-top:10px}
.links{text-align:center}
.open{display:inline-block;margin-top:10px;font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.status{margin-top:16px;border-radius:16px;padding:14px 16px;background:var(--card);border:1px solid var(--line);font-size:14px}
.status.ok{border-color:#bcd3c1;background:#f1f7f2}
.status.ok b{color:var(--ok)}
.status.warn{border-color:#ecd2c2;background:#fbf3ee}
.status .sm{font-size:12px;color:var(--sub);margin-top:4px}
.status .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font-size:14px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:none}
.sec{margin-top:24px}
.sec h2{font-size:12px;letter-spacing:.1em;color:var(--sub);font-weight:600;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=text],textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit}
.inrow{display:flex;gap:8px;margin-top:10px}
.inrow input{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-variant-numeric:tabular-nums;font-weight:600;width:46px}
.row .n{flex:1}
.row .m{font-size:11px;color:var(--sub)}
.x{border:0;background:none;color:var(--sub);font-size:13px;padding:4px 6px;cursor:pointer;font-family:inherit}
.x.sure{color:#b34a3a;font-weight:600}
.day{font-size:12px;color:var(--sub);padding:12px 0 2px;border-bottom:1px solid var(--line)}
.empty{color:var(--sub);font-size:13px;padding:14px 0;text-align:center}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--sub)}
.per{font-size:12px;color:var(--sub);margin-top:8px}
details{margin-top:24px}
summary{font-size:12px;letter-spacing:.1em;color:var(--sub);font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.note{font-size:12px;color:var(--sub);margin:8px 0}
.zoom{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9;padding:24px}
.zoom svg{width:100%;max-width:520px;height:auto}
</style>

<script>
(function(){
var QR_URL='https://iosl.cpi-cgw.com/00/1/400516/11689/01/1a2b3c4d/8b8783e6/';
var QR_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 41 41" shape-rendering="crispEdges" class="segno"><path class="qrline" stroke="#1a1410" d="M2 2.5h7m1 0h1m1 0h2m2 0h1m3 0h2m1 0h2m1 0h1m2 0h1m2 0h7m-37 1h1m5 0h1m6 0h1m1 0h2m3 0h3m2 0h2m3 0h1m5 0h1m-37 1h1m1 0h3m1 0h1m2 0h4m1 0h1m1 0h6m1 0h1m2 0h3m1 0h1m1 0h3m1 0h1m-37 1h1m1 0h3m1 0h1m1 0h2m1 0h1m1 0h4m2 0h2m1 0h2m1 0h1m2 0h1m1 0h1m1 0h3m1 0h1m-37 1h1m1 0h3m1 0h1m1 0h1m4 0h2m5 0h9m1 0h1m1 0h3m1 0h1m-37 1h1m5 0h1m1 0h3m1 0h1m1 0h1m3 0h5m7 0h1m5 0h1m-37 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-29 1h1m3 0h4m1 0h2m3 0h3m1 0h3m-29 1h1m3 0h1m1 0h3m2 0h1m3 0h1m2 0h2m2 0h3m1 0h1m1 0h6m2 0h1m-34 1h2m3 0h7m1 0h1m2 0h2m6 0h1m4 0h1m2 0h1m-35 1h3m2 0h1m5 0h2m2 0h2m2 0h3m3 0h7m1 0h1m-35 1h1m1 0h4m1 0h1m2 0h2m2 0h1m2 0h2m2 0h2m1 0h1m1 0h1m1 0h1m4 0h3m-36 1h4m1 0h6m2 0h1m1 0h5m1 0h1m1 0h2m3 0h4m2 0h3m-37 1h1m1 0h1m2 0h1m2 0h2m1 0h1m2 0h2m1 0h1m2 0h1m1 0h2m2 0h3m3 0h2m1 0h1m-36 1h1m1 0h1m1 0h1m1 0h2m2 0h1m1 0h5m1 0h1m2 0h4m2 0h1m1 0h1m1 0h5m-36 1h2m3 0h1m1 0h2m4 0h1m1 0h2m4 0h1m2 0h1m3 0h1m1 0h3m1 0h2m-35 1h1m1 0h4m1 0h1m2 0h2m2 0h2m2 0h2m2 0h2m1 0h1m3 0h1m2 0h2m1 0h1m-36 1h1m2 0h2m2 0h1m5 0h1m3 0h2m2 0h1m1 0h2m1 0h3m1 0h5m-34 1h1m1 0h1m1 0h1m1 0h1m2 0h3m1 0h1m2 0h2m1 0h3m1 0h1m1 0h2m1 0h1m1 0h1m-32 1h2m1 0h1m2 0h1m1 0h3m3 0h3m1 0h5m2 0h3m1 0h1m2 0h3m-36 1h7m1 0h2m1 0h1m4 0h3m2 0h1m2 0h1m2 0h1m1 0h3m1 0h2m-35 1h1m2 0h1m3 0h2m2 0h1m3 0h1m2 0h1m1 0h2m1 0h1m1 0h5m1 0h2m2 0h1m-35 1h1m1 0h2m1 0h1m6 0h5m5 0h3m1 0h2m2 0h5m-36 1h1m2 0h3m1 0h1m1 0h4m4 0h2m1 0h1m1 0h1m3 0h1m2 0h1m1 0h2m1 0h1m1 0h1m-36 1h2m1 0h8m6 0h2m2 0h1m1 0h1m2 0h5m1 0h3m-36 1h1m2 0h1m1 0h1m2 0h1m3 0h3m1 0h2m1 0h3m2 0h4m4 0h1m-30 1h1m2 0h1m3 0h4m2 0h1m1 0h1m1 0h1m2 0h5m1 0h1m2 0h1m1 0h1m-33 1h1m4 0h1m2 0h2m1 0h1m3 0h2m2 0h1m2 0h1m1 0h1m3 0h1m3 0h2m-36 1h3m1 0h3m1 0h1m1 0h1m1 0h1m1 0h6m1 0h1m1 0h2m2 0h6m1 0h1m1 0h1m-29 1h1m1 0h6m1 0h1m2 0h1m1 0h2m1 0h1m2 0h1m3 0h1m-33 1h7m1 0h2m2 0h2m1 0h1m2 0h1m1 0h4m2 0h1m1 0h1m1 0h1m1 0h1m2 0h1m-36 1h1m5 0h1m2 0h1m1 0h1m1 0h1m1 0h2m2 0h3m2 0h1m1 0h3m3 0h3m-35 1h1m1 0h3m1 0h1m1 0h2m2 0h1m1 0h1m1 0h1m3 0h1m2 0h2m1 0h1m1 0h7m-35 1h1m1 0h3m1 0h1m2 0h1m2 0h3m3 0h2m2 0h4m3 0h3m4 0h1m-37 1h1m1 0h3m1 0h1m3 0h2m1 0h1m1 0h1m1 0h1m1 0h1m1 0h3m1 0h2m2 0h2m3 0h1m-35 1h1m5 0h1m6 0h9m2 0h1m1 0h2m4 0h4m-36 1h7m1 0h2m4 0h1m1 0h3m1 0h2m2 0h1m1 0h1m3 0h2m1 0h4"/></svg>';
var KEY='selfcafe_v1';
var RADIUS=150;           // お店とみなす距離(m)
var DUP_HOURS=3;          // 同じお店でこの時間内の再記録はしない
var state=load();
var geo={st:'idle'};      // idle|locating|matched|recorded|dup|far|denied|error|nogeo
var sel=null, sureId=null, renameId=null, showRestore=false, flash='';
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cafes&&s.visits)return s}catch(e){}return{cafes:[],visits:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){flash='保存に失敗しました'}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return(n<10?'0':'')+n}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var W='日月火水木金土';
function dlabel(d){return(d.getMonth()+1)+'月'+d.getDate()+'日（'+W[d.getDay()]+'）'}
function hm(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dist(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function cafeById(id){for(var i=0;i<state.cafes.length;i++)if(state.cafes[i].id===id)return state.cafes[i];return null}
function cafeName(v){var c=cafeById(v.cafeId);return c?c.name:(v.cafe||'不明なお店')}

function addVisit(cafe,auto){
  var v={id:uid(),t:new Date().toISOString(),cafeId:cafe.id,cafe:cafe.name,auto:!!auto};
  state.visits.push(v);save();return v;
}
function recentAt(cafeId){
  var lim=Date.now()-DUP_HOURS*3600e3;
  for(var i=state.visits.length-1;i>=0;i--){var v=state.visits[i];if(v.cafeId===cafeId&&new Date(v.t).getTime()>=lim)return v}
  return null;
}

// ---- 位置情報 ----
var locating=false;
function locate(){
  if(locating)return;
  if(!navigator.geolocation){geo={st:'nogeo'};render();return}
  locating=true;geo={st:'locating'};render();
  var best=null,done=false,wid=null;
  function finish(){
    if(done)return;done=true;locating=false;
    if(wid!==null)navigator.geolocation.clearWatch(wid);
    if(!best)return;
    decide(best.coords.latitude,best.coords.longitude,best.coords.accuracy);
  }
  wid=navigator.geolocation.watchPosition(function(p){
    if(!best||p.coords.accuracy<best.coords.accuracy)best=p;
    if(best.coords.accuracy<=40)finish();
  },function(err){
    if(best){finish();return}
    done=true;locating=false;if(wid!==null)navigator.geolocation.clearWatch(wid);
    geo={st:err.code===1?'denied':'error',msg:err.message};render();
  },{enableHighAccuracy:true,maximumAge:20000,timeout:20000});
  setTimeout(finish,8000);
}
function decide(lat,lng,acc){
  var near=null,nd=1e12;
  state.cafes.forEach(function(c){var d=dist(lat,lng,c.lat,c.lng);if(d<nd){nd=d;near=c}});
  var tol=RADIUS+Math.min(acc||0,100);
  if(near&&nd<=tol){
    sel=near.id;
    var r=recentAt(near.id);
    if(r){geo={st:'dup',cafe:near,v:r,lat:lat,lng:lng,acc:acc,d:nd}}
    else{var v=addVisit(near,true);geo={st:'recorded',cafe:near,v:v,lat:lat,lng:lng,acc:acc,d:nd}}
  }else{
    geo={st:'far',near:near,d:near?nd:null,lat:lat,lng:lng,acc:acc};
  }
  render();
}

function statusHTML(){
  var g=geo,h='';
  if(g.st==='locating')return '<div class="status">📍 現在地を確認しています…</div>';
  if(g.st==='recorded')return '<div class="status ok"><b>✓ '+hm(new Date(g.v.t))+'「'+esc(g.cafe.name)+'」に入店を記録しました</b><div class="acts"><button class="btn ghost" id="undo">取り消す</button></div></div>';
  if(g.st==='dup')return '<div class="status ok"><b>✓ 「'+esc(g.cafe.name)+'」は '+hm(new Date(g.v.t))+' に記録済みです</b><div class="sm">同じお店で'+DUP_HOURS+'時間以内は重ねて記録しません</div><div class="acts"><button class="btn" id="again">もう一度記録する</button></div></div>';
  if(g.st==='far'){
    h='<div class="status warn"><b>近くに登録済みのセルフカフェがありません</b>';
    if(g.near)h+='<div class="sm">一番近いのは「'+esc(g.near.name)+'」（約'+fmtD(g.d)+'）</div>';
    h+='<div class="sm">今セルフカフェにいるなら、この場所を登録してください（次からは開くだけで自動記録されます）</div>';
    h+='<div class="inrow"><input type="text" id="newname" placeholder="お店の名前（例：駅前店）" maxlength="30"><button class="btn pri" id="reg">登録して記録</button></div>';
    h+='<div class="acts"><button class="btn ghost" id="retry">もう一度位置を確認</button></div></div>';
    return h;
  }
  if(g.st==='denied')return '<div class="status warn"><b>位置情報が許可されていません</b><div class="sm">iPhoneの「設定」→「プライバシーとセキュリティ」→「位置情報サービス」→「Safari Webサイト」を「使用中のみ」にし、「正確な位置情報」をオンにしてください。下の「手動で記録」も使えます。</div><div class="acts"><button class="btn" id="retry">もう一度試す</button></div></div>';
  if(g.st==='error')return '<div class="status warn"><b>現在地を取得できませんでした</b><div class="sm">電波の良い場所でもう一度試すか、下の「手動で記録」を使ってください。</div><div class="acts"><button class="btn" id="retry">もう一度試す</button></div></div>';
  if(g.st==='nogeo')return '<div class="status warn">この端末では位置情報が使えません。下の「手動で記録」を使ってください。</div>';
  return '';
}
function fmtD(d){return d>=1000?(d/1000).toFixed(1)+'km':Math.round(d)+'m'}

function render(){
  var now=new Date(),today=dkey(now),h='';
  h+='<div class="top"><h1>SELF CAFE</h1><span class="d">'+dlabel(now)+'</span></div>';
  h+='<div class="qrcard" id="qr">'+QR_SVG+'<div class="qrhint">タップで全画面表示</div></div>';
  h+='<div class="links"><a class="open" href="'+QR_URL+'" target="_blank" rel="noopener">QRのリンクを直接開く ↗</a></div>';
  h+=statusHTML();
  if(flash)h+='<div class="status warn">'+esc(flash)+'</div>';

  // stats
  var ym=today.slice(0,7),month=state.visits.filter(function(v){return dkey(new Date(v.t)).slice(0,7)===ym});
  var days={},per={};month.forEach(function(v){days[dkey(new Date(v.t))]=1;var n=cafeName(v);per[n]=(per[n]||0)+1});
  h+='<div class="sec"><h2>'+(now.getMonth()+1)+'月のまとめ</h2><div class="stats"><div class="stat"><b>'+Object.keys(days).length+'</b><span>行った日数</span></div><div class="stat"><b>'+month.length+'</b><span>入店回数</span></div></div>';
  var pk=Object.keys(per).sort(function(a,b){return per[b]-per[a]});
  if(pk.length)h+='<div class="per">'+pk.map(function(k){return esc(k)+' '+per[k]+'回'}).join(' ・ ')+'</div>';
  h+='</div>';

  // history
  h+='<div class="sec"><h2>記録</h2><div class="card">';
  if(!state.visits.length)h+='<div class="empty">まだ記録はありません</div>';
  var sorted=state.visits.slice().sort(function(a,b){return b.t<a.t?-1:1}),cur='';
  sorted.slice(0,300).forEach(function(v){
    var d=new Date(v.t),k=dkey(d);
    if(k!==cur){cur=k;h+='<div class="day">'+(k===today?'今日・':'')+dlabel(d)+'</div>'}
    h+='<div class="row"><span class="t">'+hm(d)+'</span><span class="n">'+esc(cafeName(v))+(v.auto?'':' <span class="m">手動</span>')+'</span><button class="x'+(sureId===v.id?' sure':'')+'" data-del="'+v.id+'">'+(sureId===v.id?'削除する':'×')+'</button></div>';
  });
  h+='</div></div>';

  // manual
  h+='<details id="dm"'+(openM?' open':'')+'><summary>手動で記録 ▾</summary><div class="note">位置情報がうまく取れないときに使います。</div>';
  if(state.cafes.length){
    h+='<div class="chips">';
    state.cafes.forEach(function(c){h+='<button class="chip'+(c.id===sel?' on':'')+'" data-sel="'+c.id+'">'+esc(c.name)+'</button>'});
    h+='</div><button class="btn pri" id="manual" style="width:100%;margin-top:10px;padding:13px"'+(sel?'':' disabled')+'>☕ 入店を記録</button>';
  }else h+='<div class="note">まだお店が登録されていません。お店にいるときにアプリを開くと、その場所を登録できます。</div>';
  h+='</details>';

  // cafes
  h+='<details id="dc"'+(openC?' open':'')+'><summary>登録したお店 ▾</summary>';
  if(!state.cafes.length)h+='<div class="note">まだありません</div>';
  else{h+='<div class="card" style="margin-top:8px">';
    state.cafes.forEach(function(c){
      if(renameId===c.id)h+='<div class="row"><input type="text" id="rn" value="'+esc(c.name)+'" maxlength="30"><button class="btn pri" data-rnok="'+c.id+'">OK</button></div>';
      else h+='<div class="row"><span class="n">'+esc(c.name)+'</span><button class="x" data-rn="'+c.id+'">名前変更</button><button class="x" data-mv="'+c.id+'">位置を今の場所に</button><button class="x'+(sureId==='c'+c.id?' sure':'')+'" data-dc="'+c.id+'">'+(sureId==='c'+c.id?'削除する':'×')+'</button></div>';
    });
    h+='</div>';}
  h+='<div class="note">お店に来たのに「近くにない」と出る場合は「位置を今の場所に」で位置を合わせ直してください。</div></details>';

  // backup
  h+='<details id="db"'+(openB?' open':'')+'><summary>バックアップ ▾</summary><div class="note">記録はこのiPhoneの中だけに保存されています。機種変更の前などに「コピー」して、メモ等に貼って保存してください。</div>';
  h+='<div class="acts" style="display:flex;gap:8px"><button class="btn" id="bk">バックアップをコピー</button><button class="btn ghost" id="rs">復元する</button></div>';
  if(showRestore)h+='<textarea id="rsbox" rows="4" style="margin-top:10px" placeholder="コピーしておいたバックアップを貼り付け"></textarea><button class="btn pri" id="rsok" style="margin-top:8px">この内容で復元</button>';
  h+='</details>';

  document.getElementById('app').innerHTML=h;
  bind();
}
var openM=false,openC=false,openB=false;

function on(id,fn){var e=document.getElementById(id);if(e)e.onclick=fn}
function bind(){
  ['dm','dc','db'].forEach(function(id){var e=document.getElementById(id);e.ontoggle=function(){if(id==='dm')openM=e.open;if(id==='dc')openC=e.open;if(id==='db')openB=e.open}});
  on('qr',function(){var z=document.createElement('div');z.className='zoom';z.innerHTML=QR_SVG;z.onclick=function(){z.remove()};document.body.appendChild(z)});
  on('retry',function(){locate()});
  on('undo',function(){var id=geo.v&&geo.v.id;state.visits=state.visits.filter(function(v){return v.id!==id});save();geo={st:'idle'};render()});
  on('again',function(){var v=addVisit(geo.cafe,true);geo={st:'recorded',cafe:geo.cafe,v:v};render()});
  on('reg',function(){
    var n=document.getElementById('newname').value.trim();if(!n){document.getElementById('newname').focus();return}
    var c={id:uid(),name:n,lat:geo.lat,lng:geo.lng};state.cafes.push(c);
    var v=addVisit(c,true);sel=c.id;geo={st:'recorded',cafe:c,v:v};render();
  });
  document.querySelectorAll('[data-sel]').forEach(function(b){b.onclick=function(){sel=b.getAttribute('data-sel');render()}});
  on('manual',function(){var c=cafeById(sel);if(!c)return;var v=addVisit(c,false);geo={st:'recorded',cafe:c,v:v};render();window.scrollTo(0,0)});
  document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-del');if(sureId!==id){sureId=id;render();return}state.visits=state.visits.filter(function(v){return v.id!==id});sureId=null;save();render()}});
  document.querySelectorAll('[data-dc]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-dc');if(sureId!=='c'+id){sureId='c'+id;render();return}state.cafes=state.cafes.filter(function(c){return c.id!==id});sureId=null;save();render()}});
  document.querySelectorAll('[data-rn]').forEach(function(b){b.onclick=function(){renameId=b.getAttribute('data-rn');render();var i=document.getElementById('rn');if(i)i.focus()}});
  document.querySelectorAll('[data-rnok]').forEach(function(b){b.onclick=function(){var c=cafeById(b.getAttribute('data-rnok'));var n=document.getElementById('rn').value.trim();if(c&&n){c.name=n;state.visits.forEach(function(v){if(v.cafeId===c.id)v.cafe=n});save()}renameId=null;render()}});
  document.querySelectorAll('[data-mv]').forEach(function(b){b.onclick=function(){
    var c=cafeById(b.getAttribute('data-mv'));if(!c||!navigator.geolocation)return;b.textContent='確認中…';
    navigator.geolocation.getCurrentPosition(function(p){c.lat=p.coords.latitude;c.lng=p.coords.longitude;save();flash='';render();b=null},function(){flash='現在地を取得できませんでした';render()},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  }});
  on('bk',function(){var t=JSON.stringify(state);var btn=document.getElementById('bk');
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){btn.textContent='コピーしました ✓'},function(){showRestore=false;flash='コピーできませんでした';render()})});
  on('rs',function(){showRestore=!showRestore;render()});
  on('rsok',function(){try{var s=JSON.parse(document.getElementById('rsbox').value);if(!s.cafes||!s.visits)throw 0;state=s;save();showRestore=false;flash='';render()}catch(e){flash='バックアップの形式が正しくありません';render()}});
}

render();
locate();
// ホーム画面アプリを再度開いたとき（バックグラウンドから戻ったとき）も確認
var lastCheck=Date.now();
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){
    if(Date.now()-lastCheck>60000){lastCheck=Date.now();locate()}else render();
  }
});
})();
</script>
</body>
</html>
